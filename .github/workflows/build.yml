new coin: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            python3-dev \
            git \
            wget \
            unzip \
            ninja-build \
            autoconf \
            libtool

      - name: Set up Android SDK
        run: |
          mkdir -p ~/android-sdk
          cd ~/android-sdk
          
          echo "📥 Downloading Android cmdline-tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          rm -f commandlinetools-linux-9477386_latest.zip
          
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_PATH

      - name: Install Android components
        run: |
          echo "📦 Installing Android components..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            2>&1 | tail -20

      - name: Install Python dependencies
        run: |
          echo "📚 Installing Python dependencies..."
          python -m pip install --upgrade pip setuptools wheel
          pip install cython kivy buildozer

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ steps.get-date.outputs.date }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Check buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "Creating buildozer.spec..."
            buildozer init
          fi

      - name: Build with Buildozer
        run: |
          echo "🔨 Starting build..."
          buildozer -v android debug 2>&1 | tee build.log

      - name: Check APK
        run: |
          echo "🔍 Looking for APK..."
          if find bin -name "*.apk" -type f 2>/dev/null | grep -q .; then
            echo "✅ APK created successfully!"
            find bin -name "*.apk" -type f -exec ls -lh {} \;
          else
            echo "❌ APK not found"
            ls -la bin/ || echo "bin/ not found"
            tail -100 build.log || true
            exit 1
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.get-date.outputs.date }}
          path: bin/*.apk
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.get-date.outputs.date }}
          path: build.log
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
