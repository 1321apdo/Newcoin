name: GitHub Smart Builder English

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Buildozer Android SDK and Pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.cache/pip
        key: ${{ runner.os }}-buildozer-v6-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v6-${{ hashFiles('buildozer.spec') }}-
          ${{ runner.os }}-buildozer-v6-

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg ccache automake autoconf libtool pkg-config \
        libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
        libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev python3-dev python3-pip
        
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        source venv/bin/activate
        yes | buildozer android acceptcode || true
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Clean-App-APK
        path: bin/*.apk
