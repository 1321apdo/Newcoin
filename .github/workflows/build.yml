name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: false
        submodules: false
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Buildozer Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          autoconf \
          libtool \
          m4 \
          pkg-config \
          git \
          zip \
          unzip \
          libltdl-dev \
          zlib1g-dev \
          zlib1g:i386 \
          libncurses5:i386 \
          libstdc++6:i386 \
          openjdk-17-jdk \
          cmake \
          ccache \
          clang

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install "cython>=0.29.33,<3.0.0" kivy buildozer pythonforandroid

    - name: Build APK with Buildozer
      run: |
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
        export BUILDOZER_WARN_ON_ROOT=0
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug-${{ github.run_number }}
        path: bin/*.apk
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
