name: GitHub Smart Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 1. التخزين المؤقت الذكي لمكتبات بايثون وملفات أندرويد
    - name: Cache Buildozer Android SDK and Pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.cache/pip
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-
          ${{ runner.os }}-buildozer-

    # 2. تثبيت الحزم الأساسية والمتقدمة للنظام
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg ccache automake autoconf libtool pkg-config \
        libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
        libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev python3-dev
        
        # إنشاء بيئة وهمية وتثبيت أدوات بناء البايثون داخلها بأمان
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython virtualenv bidi arabic-reshaper

    # 3. قبول تراخيص أندرويد وبناء التطبيق بذكاء
    - name: Build APK with Buildozer
      run: |
        source venv/bin/activate
        # قبول شروط تراخيص أندرويد مسبقاً لمنع توقف السيرفر
        yes | buildozer android acceptcode || true
        # تشغيل البناء مع طباعة التفاصيل بالكامل
        buildozer -v android debug

    # 4. رفع ملف الـ APK الناتج لتحميله مباشرة
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Smart-App-APK
        path: bin/*.apk
